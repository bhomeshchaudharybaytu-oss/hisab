<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1b1b">
<title>Hisab</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:#f2f2f0;color:#1b1b1b;padding-bottom:80px}
button,input{font:inherit}
.top{background:#1b1b1b;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
.top h1{font-size:20px;margin:0;flex:1}
.seg{display:flex;border:2px solid #fff;border-radius:10px;overflow:hidden}
.seg button{background:none;color:#fff;border:0;padding:7px 12px;font-weight:700}
.seg button.on{background:#fff;color:#1b1b1b}
.lo{background:none;border:0;color:#bbb;font-size:13px}
.banner{background:#ffd400;text-align:center;font-weight:700;padding:5px;font-size:13px}
.wrap{padding:12px;max-width:560px;margin:auto}
.res{border-radius:16px;padding:22px 14px;text-align:center;color:#fff;margin-bottom:12px}
.res small{display:block;font-size:15px;font-weight:600;opacity:.95}
.res b{display:block;font-size:42px;margin-top:6px;line-height:1.1}
.red{background:#ff0000}.green{background:#00b300}.zero{background:#555}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.card{background:#fff;border:2px solid #1b1b1b;border-radius:14px;padding:12px;position:relative}
.card small{display:block;color:#555;font-size:13px}
.card b{font-size:24px}
.card .pen{position:absolute;right:6px;top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.big{border:0;border-radius:12px;padding:16px 8px;font-size:17px;font-weight:700;color:#fff;background:#1b1b1b}
.big.s{background:#00b300}.big.e{background:#ff0000}
h2{font-size:16px;margin:16px 0 8px}
.row{background:#fff;border:1px solid #ccc;border-radius:12px;padding:10px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:15px}
.row .m span{font-size:12px;color:#555}
.row .a{font-weight:800;font-size:15px;white-space:nowrap}
.g{color:#00a000}.r{color:#ff0000}
.ic{background:#eee;border:0;border-radius:8px;padding:8px 9px;font-size:16px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1b1b1b;display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
.nav button{flex:1;background:none;border:0;color:#aaa;padding:14px;font-size:16px;font-weight:700}
.nav button.on{color:#fff;box-shadow:inset 0 3px #fff}
.empty{text-align:center;color:#777;padding:14px;font-size:14px}
.sum{background:#fff;border:2px solid #1b1b1b;border-radius:14px;padding:12px;margin-bottom:12px}
.sum div{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.hd{display:flex;gap:8px;margin-bottom:12px}
.hd input{flex:1;padding:12px;border:2px solid #1b1b1b;border-radius:10px;background:#fff}
.hd button{padding:0 14px;border:2px solid #1b1b1b;border-radius:10px;background:#fff;font-weight:700}
.hd button.on{background:#1b1b1b;color:#fff}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;align-items:flex-end}
#sheet.show{display:flex}
.box{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;max-width:560px;margin:auto}
.box h3{margin:0 0 10px;font-size:19px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input.f{width:100%;padding:13px;border:2px solid #1b1b1b;border-radius:10px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid #1b1b1b;background:#fff;border-radius:10px;padding:11px 14px;font-weight:700;font-size:16px}
.chip.on{background:#1b1b1b;color:#fff}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay .chip{padding:16px;font-size:18px;text-align:center}
.tot{text-align:center;font-size:30px;font-weight:800;margin:14px 0 0}
.oth{background:none;border:0;text-decoration:underline;color:#555;margin-top:10px;font-size:14px}
.save{width:100%;margin-top:16px;padding:16px;border:0;border-radius:12px;background:#00b300;color:#fff;font-size:18px;font-weight:800}
.cancel{width:100%;margin-top:8px;padding:12px;border:0;background:none;font-size:15px;color:#555}
.login{max-width:360px;margin:12vh auto;padding:20px}
.login h1{text-align:center}
.err{color:#ff0000;font-size:14px;min-height:20px;margin-top:10px}
#cf{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:40;align-items:center;justify-content:center;padding:16px}
#cf.show{display:flex}
.cfb{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:420px;max-height:88vh;overflow:auto}
.cfb h3{margin:0 0 10px;font-size:20px}
.cfd div,.cfd2 div,.cfe div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:15px;border-bottom:1px solid #eee}
.cfd div b,.cfd2 div b,.cfe div b{text-align:right}
.cfe{background:#f2f2f0;border-radius:10px;padding:8px 10px;margin-top:10px}
.cfe p,.cfp{margin:0 0 4px;font-size:13px;color:#555;font-weight:700}
.cfa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cfa button{padding:15px;border:0;border-radius:12px;font-size:17px;font-weight:800}
.cfn{background:#ddd;color:#1b1b1b}.cfy{background:#00b300;color:#fff}.cfy.dg{background:#ff0000}
.sticky{position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:6px;padding:8px 10px;background:#f2f2f0;border-bottom:1px solid #ccc}
.tabs button{flex:1;padding:10px 2px;border:2px solid #1b1b1b;border-radius:10px;background:#fff;font-weight:800;font-size:13px}
.tabs button.on{background:#1b1b1b;color:#fff}
.gh{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14px;margin:14px 0 6px;padding:7px 10px;background:#1b1b1b;color:#fff;border-radius:8px}
.fc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fc .chip{padding:8px 12px;font-size:14px}
.dt{position:relative;display:block}
.dt span{display:block;padding:13px;border:2px solid #1b1b1b;border-radius:10px;font-size:17px;font-weight:700;background:#fff}
.dt input.dp{position:absolute;inset:0;width:100%;height:100%;opacity:0;padding:0;border:0}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.mini{border-radius:12px;padding:8px 4px;color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:space-between;min-height:68px}
.mini small{font-size:10.5px;font-weight:700;line-height:1.15;opacity:.95}
.mini b{font-size:13.5px;margin-top:4px;word-break:break-all;line-height:1.1}
.rl{text-align:center;font-size:12px;color:#555;font-weight:700;margin-bottom:12px}
.gear{font-size:20px;color:#fff}
.hint{font-size:13px;color:#555;margin-top:6px;font-weight:700}
.res.sm{padding:10px 12px;margin-bottom:12px}
.res.sm small{font-size:13px}
.res.sm b{font-size:24px;margin-top:2px}
.today{position:relative;margin:0 0 12px;padding:34px 14px 14px;border-radius:20px;color:#fff;text-align:center;background:radial-gradient(circle at 85% 12%,rgba(245,197,66,.28),transparent 45%),linear-gradient(135deg,#0d1b3e,#1e2f66);border:4px double #f5c542;box-shadow:0 0 0 3px #0d1b3e,0 8px 18px rgba(13,27,62,.45);overflow:hidden}
.today .rib{position:absolute;top:0;left:0;background:#f5c542;color:#0d1b3e;font-weight:800;font-size:12px;padding:5px 14px 5px 10px;border-radius:0 0 14px 0}
.today .stk{position:absolute}
.today .s1{top:6px;right:12px;font-size:22px}
.today .s2{top:50px;right:14px;font-size:34px}
.today .s3{top:52px;left:14px;font-size:30px}
.today .tl{font-size:14px;font-weight:700;color:#f5c542}
.today .ta{font-size:40px;font-weight:900;line-height:1.15;background:linear-gradient(#fff6c2,#f5c542);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.today .tc{font-size:12px;opacity:.85;margin-top:2px}
.today .tb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.today .tb div{background:rgba(255,255,255,.1);border:1px solid rgba(245,197,66,.65);border-radius:12px;padding:8px 6px;font-size:13px}
.today .tb b{color:#ffe08a}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
.pk{border:3px solid #1b1b1b;border-radius:18px;padding:20px 8px 14px;text-align:center;position:relative;color:#1b1b1b}
.pk .em{display:block;font-size:52px;line-height:1}
.pk b{display:block;font-size:19px;margin-top:8px}
.pk small{display:block;font-size:13px;color:#444;margin-top:2px}
.pk .tag{position:absolute;top:6px;right:8px;font-size:18px}
.pk.b1{background:linear-gradient(#fff4d2,#ffe08a)}
.pk.b2{background:linear-gradient(#e3f4ff,#a9d8ff)}
.today .nv{position:absolute;top:44%;transform:translateY(-50%);width:13px;height:64px;border:0;background:none;color:rgba(245,197,66,.38);font-size:30px;line-height:1;padding:0;z-index:2}
.today .nv::after{content:"";position:absolute;inset:-12px -9px}
.today .nl{left:2px}.today .nr{right:1px}
.tin.fl{animation:inL .28s ease}
.tin.fr{animation:inR .28s ease}
@keyframes inL{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
.today{touch-action:pan-y}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"><div class="box" id="box"></div></div>
<div id="cf"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,addDoc,setDoc,doc,deleteDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyBPZgNn3yagJruuaisPe-My7foN6_7eo2k",
  authDomain:"hisab-2cb5f.firebaseapp.com",
  projectId:"hisab-2cb5f",
  storageBucket:"hisab-2cb5f.firebasestorage.app",
  messagingSenderId:"151575301734",
  appId:"1:151575301734:web:f72501ad1a61d65fabe7a7"
});
const auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const col=collection(db,'tx');

let user=null,tx=[],mode='final',tab='home',hdate=null,f=null,unsub=null,loginErr='',htab='all',hf={sales:'all',exp:'all',stock:'all'};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function now(){
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return {d:`${p.year}-${p.month}-${p.day}`,t:`${p.hour==='24'?'00':p.hour}:${p.minute}`};
}
const R=n=>Math.round((+n||0)*100)/100;
const fm=n=>'₹'+R(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const sg=n=>(n>0?'+':n<0?'−':'')+Math.abs(R(n)).toLocaleString('en-IN');
const fd=d=>d.split('-').reverse().join('-');
const t12=t=>{let[h,m]=t.split(':');h=+h;const a=h>=12?'PM':'AM';h=h%12||12;return `${h}:${m} ${a}`};
const payTxt=e=>e.cash&&e.online?`Cash ${fm(e.cash)} + Online ${fm(e.online)}`:e.cash?'💵 Cash':'🏦 Online';

/* ---------- calculations ---------- */
function calc(l){
  const r={sale:0,cash:0,online:0,bkt:0,loL:0,exp:0,by:{},stockIn:0,lStockIn:0};
  for(const e of l){
    if(e.type==='sale'){r.sale+=e.total;r.cash+=e.cash;r.online+=e.online;if(e.kind==='BKT')r.bkt+=e.qty;else r.loL+=e.litres}
    else if(e.type==='expense'||e.type==='rough'){const c=e.type==='rough'?'Personal (rough)':e.cat;r.exp+=e.amount;r.by[c]=(r.by[c]||0)+e.amount;r.cash-=e.cash;r.online-=e.online}
    else if(e.type==='adjust'){r.cash+=e.cash;r.online+=e.online}
    else if(e.type==='stock'){if(e.item==='LOOSE')r.lStockIn+=e.qty;else r.stockIn+=e.qty}
  }
  r.result=R(r.sale-(r.cash+r.online+r.exp));
  return r;
}
const stockNow=()=>{const a=calc(tx);return R(a.stockIn-a.bkt)};
const looseNow=()=>{const a=calc(tx);return R(a.lStockIn-a.loL)};

/* ---------- confirmation ---------- */
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cfRes=null;
function ask({title,html='',yes='Yes',danger=false}){
  return new Promise(res=>{
    cfRes=res;
    $('#cf').innerHTML=`<div class="cfb"><h3>${title}</h3>${html}<div class="cfa"><button class="cfn" data-cf="0">Cancel</button><button class="cfy${danger?' dg':''}" data-cf="1">${yes}</button></div></div>`;
    $('#cf').classList.add('show');
  });
}
function cfDone(v){$('#cf').classList.remove('show');const r=cfRes;cfRes=null;if(r)r(v)}
const lbl=e=>({sale:'sale',expense:'expense',rough:'personal item',stock:'stock entry',adjust:'adjustment'})[e.type]||'entry';
function flds(e){
  const o={Date:fd(e.date)};
  if(e.type==='sale'){o.Item=e.kind==='BKT'?'BKT':'Loose';if(e.kind==='BKT'){o.Quantity=e.qty;o.Price=fm(e.price)}else{o.Litres=e.litres;o.Rate=fm(e.rate)}o.Total=fm(e.total);o.Payment=payTxt(e)}
  else if(e.type==='expense'||e.type==='rough'){o.Type=e.type==='rough'?'Personal':e.cat;o.Amount=fm(e.amount);o.Note=esc(e.note)||'-';o.Payment=payTxt(e)}
  else if(e.type==='stock'){const L=e.item==='LOOSE';o.Item=L?'Loose':'BKT';o[L?'Litres':'Buckets']=sg(e.qty);o.Note=esc(e.note)||'-'}
  else{o.Cash=sg(e.cash);o.Online=sg(e.online)}
  return o;
}
const show=e=>`<div class="cfd">${Object.entries(flds(e)).map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('')}</div>`;
function diff(a,b){
  const x=flds(a),y=flds(b);
  const k=[...new Set([...Object.keys(x),...Object.keys(y)])].filter(k=>String(x[k])!==String(y[k]));
  return `<div class="cfd">${k.length?k.map(k=>`<div><span>${k}</span><b>${x[k]??'-'} → ${y[k]??'-'}</b></div>`).join(''):'<div><span>No visible change</span></div>'}</div>`;
}
function effect(newList){
  const a=calc(tx),b=calc(newList);
  const res=x=>x>0?'Owe '+fm(x):x<0?'Get '+fm(-x):'Clear';
  const rows=[['Cash',a.cash,b.cash,fm],['Online',a.online,b.online,fm],['BKT stock',R(a.stockIn-a.bkt),R(b.stockIn-b.bkt),x=>x],['Loose stock',R(a.lStockIn-a.loL),R(b.lStockIn-b.loL),x=>x+' L'],['Final result',a.result,b.result,res]];
  const ch=rows.filter(r=>R(r[1])!==R(r[2])).map(r=>`<div><span>${r[0]}</span><b>${r[3](r[1])} → ${r[3](r[2])}</b></div>`).join('');
  return `<div class="cfe"><p>After this:</p>${ch||'<div><span>Balances unchanged</span></div>'}</div>`;
}

/* ---------- totals period setting ---------- */
let cfg={mode:'all',from:'',to:''};
try{const c=JSON.parse(localStorage.getItem('hisabCfg')||'null');if(c&&c.mode)cfg=c}catch(e){}
function rangeOf(){
  const t=now().d;
  if(cfg.mode==='today')return[t,t];
  if(cfg.mode==='month')return[t.slice(0,8)+'01',t];
  if(cfg.mode==='custom')return[cfg.from||'0000-01-01',cfg.to||'9999-12-31'];
  return null;
}
function rangeLabel(){
  const r=rangeOf();
  if(!r)return 'All time';
  if(cfg.mode==='today')return 'Today ('+fd(r[0])+')';
  if(cfg.mode==='month')return 'This month ('+fd(r[0])+' to '+fd(r[1])+')';
  return (cfg.from?fd(cfg.from):'Start')+' to '+(cfg.to?fd(cfg.to):'Today');
}
function fourCards(){
  const r=rangeOf(),l=r?tx.filter(e=>e.date>=r[0]&&e.date<=r[1]):tx;
  const c=calc(l);
  const owner=R(l.filter(e=>e.type==='expense'&&e.cat==='Send to Owner').reduce((a,e)=>a+e.amount,0));
  const m=(bg,t,v)=>`<div class="mini" style="background:${bg}"><small>${t}</small><b>${fm(v)}</b></div>`;
  return `<div class="four">${m('#1565c0','Total sale',c.sale)}${m('#ef6c00','Total expense',R(c.exp-owner))}${m('#6a1b9a','Total owner pay',owner)}${m('#00838f','Available balance',R(c.cash+c.online))}</div><div class="rl">📅 ${rangeLabel()}</div>`;
}

/* ---------- rendering ---------- */
function rowHTML(e){
  const tm=e.time?' • '+t12(e.time):'';
  let title,sub='',amt='',cls='';
  if(e.type==='sale'){title=e.kind==='BKT'?`🪣 BKT × ${e.qty} @ ${fm(e.price)}`:`🛢️ Loose ${e.litres} L @ ${fm(e.rate)}`;sub=payTxt(e);amt='+'+fm(e.total);cls='g'}
  else if(e.type==='expense'){title=e.cat;sub=(e.note?esc(e.note)+' • ':'')+payTxt(e);amt='−'+fm(e.amount);cls='r'}
  else if(e.type==='rough'){title='📝 '+esc(e.note||'Personal');sub='Rough • '+payTxt(e);amt='−'+fm(e.amount);cls='r'}
  else if(e.type==='adjust'){title='⇄ Adjust';sub=`Cash ${sg(e.cash)} • Online ${sg(e.online)}`}
  else{title=e.item==='LOOSE'?`🛢️ Loose stock ${sg(e.qty)} L`:`📦 BKT stock ${sg(e.qty)}`;sub=esc(e.note)}
  const btn=mode==='edit'?`<button class="ic" data-act="edit" data-id="${e.id}">✏️</button><button class="ic" data-act="del" data-id="${e.id}">🗑️</button>`:'';
  return `<div class="row"><div class="m"><b>${title}</b><span>${fd(e.date)}${tm}${sub?' • '+sub:''}</span></div><div class="a ${cls}">${amt}</div>${btn}</div>`;
}
const sortDesc=l=>[...l].sort((a,b)=>(b.date.localeCompare(a.date))||((b.ms||0)-(a.ms||0)));
const list=l=>l.length?sortDesc(l).map(rowHTML).join(''):'<div class="empty">No entries</div>';

function resultCard(r,label,c){
  const v=r.result,sp=c?' ':'<br>',cl=c?' sm':'';
  if(v>0)return `<div class="res red${cl}"><small>${label}</small><b>YOU OWE OWNER${sp}${fm(v)}</b></div>`;
  if(v<0)return `<div class="res green${cl}"><small>${label}</small><b>OWNER OWES YOU${sp}${fm(-v)}</b></div>`;
  return `<div class="res zero${cl}"><small>${label}</small><b>ALL CLEAR${sp}₹0</b></div>`;
}
const tabsHTML=()=>`<div class="tabs">${[['all','All'],['sales','Sales'],['exp','Expenses'],['stock','Stock']].map(([v,t])=>`<button data-act="htab" data-v="${v}" class="${htab===v?'on':''}">${t}</button>`).join('')}</div>`;
function render(){
  const a=$('#app');
  if(!user){
    a.innerHTML=`<div class="login"><h1>Hisab</h1><label>Email</label><input class="f" id="em" type="email" autocomplete="username"><label>Password</label><input class="f" id="pw" type="password" autocomplete="current-password"><button class="save" data-act="login" style="background:#1b1b1b">Login</button><div class="err">${loginErr}</div></div>`;
    return;
  }
  const head=`<div class="sticky"><div class="top"><h1>Hisab</h1><div class="seg"><button data-act="mode" data-v="final" class="${mode==='final'?'on':''}">Final</button><button data-act="mode" data-v="edit" class="${mode==='edit'?'on':''}">Edit</button></div><button class="lo" data-act="logout">Logout</button><button class="lo gear" data-act="cfg">⚙️</button></div>${mode==='edit'?'<div class="banner">EDIT MODE: pencil and delete are visible</div>':''}${tab==='hist'?tabsHTML():''}</div>`;
  const nav=`<div class="nav"><button data-act="tab" data-v="home" class="${tab==='home'?'on':''}">🏠 Home</button><button data-act="tab" data-v="hist" class="${tab==='hist'?'on':''}">📅 History</button></div>`;
  a.innerHTML=head+`<div class="wrap">${tab==='home'?home():history()}</div>`+nav;
}

let tday=null,slideDir='';
const addDay=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
function canNav(v){
  const today=now().d,cur=tday||today,nx=addDay(cur,v);
  const minD=tx.reduce((m,e)=>e.date<m?e.date:m,today);
  return nx<=today&&!(v<0&&cur<=minD);
}
function navDay(v){
  if(!canNav(v))return false;
  const today=now().d,nx=addDay(tday||today,v);
  tday=nx===today?null:nx;slideDir=v<0?'l':'r';render();slideDir='';return true;
}
function todayCard(){
  const today=now().d,d=tday||today;
  const l=tx.filter(e=>e.date===d&&e.type==='sale');
  const minD=tx.reduce((m,e)=>e.date<m?e.date:m,today);
  let tot=0,bk=0,lt=0,on=0,ca=0;
  l.forEach(e=>{tot+=e.total;on+=e.online;ca+=e.cash;if(e.kind==='BKT')bk+=e.qty;else lt+=e.litres});
  const rib=d===today?`📅 TODAY • ${fd(d)}`:d===addDay(today,-1)?`📅 YESTERDAY • ${fd(d)}`:`📅 ${fd(d)}`;
  const anim=slideDir==='l'?' fl':slideDir==='r'?' fr':'';
  return `<div class="today" data-d="${d}"><div class="rib">${rib}</div><span class="stk s1">✨</span><span class="stk s2">💰</span><span class="stk s3">🪙</span>
  ${d>minD?'<button class="nv nl" data-act="tnav" data-v="-1">‹</button>':''}${d<today?'<button class="nv nr" data-act="tnav" data-v="1">›</button>':''}
  <div class="tin${anim}"><div class="tl">${d===today?"Today's sale":"Day's sale"}</div><div class="ta">${fm(tot)}</div><div class="tc">🧾 ${l.length} sale${l.length===1?'':'s'}</div>
  <div class="tb"><div>🪣 BKT <b>${bk}</b></div><div>🛢️ Loose <b>${R(lt)} L</b></div><div>🏦 Online <b>${fm(on)}</b></div><div>💵 Cash <b>${fm(ca)}</b></div></div></div></div>`;
}

const catOf=e=>e.type==='rough'?'Personal':e.cat;
function groupList(l,all,kind){
  if(!l.length)return '<div class="empty">No entries</div>';
  if(!all)return list(l);
  const days={};l.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  return Object.keys(days).sort().reverse().map(dt=>{
    const c=calc(days[dt]);
    const t=kind==='sales'?fm(c.sale):kind==='exp'?'−'+fm(c.exp):kind==='stock'?'BKT '+sg(c.stockIn)+' • '+sg(c.lStockIn)+' L':`Sale ${fm(c.sale)} • Exp ${fm(c.exp)}`;
    return `<div class="gh"><span>${fd(dt)}</span><span>${t}</span></div>`+list(days[dt]);
  }).join('');
}
function history(){
  const all=hdate==='all',d=hdate||now().d;
  const l=all?tx:tx.filter(e=>e.date===d);
  const bar=`<div class="hd"><div class="dt" style="flex:1"><span>${all?'Select date':fd(d)}</span><input class="dp" type="date" id="hd" value="${all?'':d}"></div><button data-act="hall" class="${all?'on':''}">Total</button></div>`;
  const chips=o=>`<div class="fc">${o.map(([v,t])=>`<button class="chip${hf[htab]===v?' on':''}" data-act="hf" data-v="${v}">${t}</button>`).join('')}</div>`;
  const row=(a,b,c='')=>`<div><span>${a}</span><b class="${c}">${b}</b></div>`;
  const when=all?'Total':fd(d);
  if(htab==='sales'){
    let s=l.filter(e=>e.type==='sale');
    if(hf.sales!=='all')s=s.filter(e=>e.kind===hf.sales);
    const c=calc(s);
    return bar+chips([['all','All'],['BKT','BKT'],['LOOSE','Loose']])+`<div class="sum">${row('Total sale ('+when+')',fm(c.sale),'g')}${row('BKT sold',c.bkt)}${row('Loose sold',R(c.loL)+' L')}${row('🏦 Online',fm(c.online))}${row('💵 Cash',fm(c.cash))}</div>`+groupList(s,all,'sales');
  }
  if(htab==='exp'){
    let s=l.filter(e=>e.type==='expense'||e.type==='rough');
    if(hf.exp!=='all')s=s.filter(e=>catOf(e)===hf.exp);
    const by={};let cash=0,on=0,tot=0;
    s.forEach(e=>{by[catOf(e)]=(by[catOf(e)]||0)+e.amount;cash+=e.cash;on+=e.online;tot+=e.amount});
    const cats=Object.keys(by).map(k=>row(k,fm(by[k]),'r')).join('');
    return bar+chips([['all','All'],['Personal','Personal'],['Petrol','Petrol'],['Send to Owner','Send to Owner'],['Others','Others']])+`<div class="sum">${row('Total expenses ('+when+')','−'+fm(tot),'r')}${cats}${row('🏦 Paid online',fm(on))}${row('💵 Paid cash',fm(cash))}</div>`+groupList(s,all,'exp');
  }
  if(htab==='stock'){
    const isB=e=>(e.item||'BKT')==='BKT';
    let s=l.filter(e=>e.type==='stock');
    const q=hf.stock;
    if(q==='bkt')s=s.filter(e=>e.type==='stock'&&isB(e));
    else if(q==='loose')s=s.filter(e=>e.type==='stock'&&!isB(e));
    const c=calc(l);
    return bar+chips([['all','All'],['bkt','BKT stock'],['loose','Loose stock']])+`<div class="sum">${row('🪣 BKT received ('+when+')',sg(c.stockIn))}${row('🪣 BKT sold',c.bkt)}${row('🪣 BKT available now',stockNow())}${row('🛢️ Loose received',sg(c.lStockIn)+' L')}${row('🛢️ Loose sold',R(c.loL)+' L')}${row('🛢️ Loose available now',looseNow()+' L')}</div>`+groupList(s,all,'stock');
  }
  const r=calc(l);
  const by=Object.keys(r.by).map(k=>`<div><span>${k}</span><b>${fm(r.by[k])}</b></div>`).join('');
  return bar+resultCard(r,all?'Total result':'Result for '+fd(d))+
  `<div class="sum">
    <div><span>Total sale</span><b>${fm(r.sale)}</b></div>
    <div><span>BKT sold</span><b>${r.bkt}</b></div>
    <div><span>Loose sold</span><b>${R(r.loL)} L</b></div>
    <div><span>Cash</span><b>${fm(r.cash)}</b></div>
    <div><span>Online</span><b>${fm(r.online)}</b></div>
    ${by}
    <div><span>Total expenses</span><b>${fm(r.exp)}</b></div>
  </div>`+groupList(l.filter(e=>e.type!=='adjust'),all,'all');
}

const autoTotal=()=>R((+f.litres||0)*(f.rate||0));
const saleTotal=()=>f.kind==='BKT'?R((f.qty||0)*(f.price||0)):f.kind==='LOOSE'?(f.amt!==''&&f.amt!=null?R(f.amt):autoTotal()):0;
const syncAmt=()=>{if(f.kind==='LOOSE'){const a=autoTotal();f.amt=a>0?String(a):''}};
const closeSheet=()=>{$('#sheet').classList.remove('show');f=null};

function base(e){const n=now();return e?{id:e.id,date:e.date,time:e.time||'',ms:e.ms||Date.now()}:{date:n.d,time:null,ms:Date.now()}}
function openSale(e){f={k:'sale',...base(e),kind:e?e.kind:'',qty:e&&e.kind==='BKT'?e.qty:'',price:e&&e.kind==='BKT'?e.price:'',litres:e&&e.kind==='LOOSE'?e.litres:'',rate:e&&e.kind==='LOOSE'?e.rate:'',amt:e&&e.kind==='LOOSE'?String(e.total):'',pay:e?(e.cash&&e.online?'split':e.cash?'cash':'online'):'',cashAmt:e?e.cash:''};draw()}
function openExp(e){f={k:'exp',...base(e),cat:e?(e.type==='rough'?'Personal':e.cat):'',amount:e?e.amount:'',note:e?e.note||'':'',pay:e?(e.cash&&e.online?'split':e.cash?'cash':'online'):'',cashAmt:e?e.cash:''};draw()}
function openPick(){f={k:'pick'};draw()}
function openStock(e,m,item){f={k:'stock',...base(e),item:e?(e.item||'BKT'):(item||'BKT'),mode:e?'add':(m||'add'),qty:e?e.qty:'',note:e?e.note||'':''};draw()}
function openCfg(){f={k:'cfg',mode:cfg.mode,from:cfg.from,to:cfg.to};draw()}
function saveCfg(){
  if(f.mode==='custom'&&!f.from&&!f.to)return alert('Select at least a From or To date');
  if(f.mode==='custom'&&f.from&&f.to&&f.from>f.to)return alert('From date is after To date');
  cfg={mode:f.mode,from:f.mode==='custom'?f.from:'',to:f.mode==='custom'?f.to:''};
  try{localStorage.setItem('hisabCfg',JSON.stringify(cfg))}catch(e){}
  closeSheet();render();
}
function openAdj(e){const c=calc(tx);f={k:'adj',...base(e),mode:e?'delta':'actual',c:e?e.cash:R(c.cash),o:e?e.online:R(c.online)};draw()}

function stamp(){ // date + IST time + order
  const n=now();
  const o={date:f.date,ms:f.ms};
  o.time=f.id?(f.time||''):(f.date===n.d?n.t:'');
  return o;
}
async function put(data,msg){
  const id=f.id;
  if(id){
    const old=tx.find(x=>x.id===id);
    const ok=await ask({title:`Update this ${lbl(data)}?`,html:(old?diff(old,data):'')+effect(tx.map(x=>x.id===id?{...data,id}:x)),yes:'Yes, Update'});
    if(!ok)return;
  }else if(msg){
    const ok=await ask({title:msg.title,html:msg.html+effect(tx.concat({...data,id:'new'})),yes:msg.yes});
    if(!ok)return;
  }
  const p=id?setDoc(doc(db,'tx',id),data):addDoc(col,data);
  p.catch(e=>alert('Save failed: '+e.message));
  closeSheet();
}
function split(total){
  if(f.pay==='cash')return{cash:total,online:0};
  if(f.pay==='online')return{cash:0,online:total};
  const c=Math.min(Math.max(R(f.cashAmt),0),total);return{cash:c,online:R(total-c)};
}

function save(){
  if(!f.date)return alert('Select a date');
  if(f.k==='sale'){
    const total=saleTotal();
    if(!f.kind)return alert('Choose BKT or Loose');
    if(f.kind==='BKT'&&(!f.qty||!f.price))return alert('Select quantity and price');
    if(f.kind==='LOOSE'&&(!(+f.litres>0)||!f.rate))return alert('Enter litres and select rate');
    if(!(total>0))return alert('Enter amount');
    if(!f.pay)return alert('Select Online or Cash');
    const s=split(total);
    put({type:'sale',...stamp(),kind:f.kind,qty:f.kind==='BKT'?f.qty:0,price:f.kind==='BKT'?f.price:0,litres:f.kind==='LOOSE'?R(f.litres):0,rate:f.kind==='LOOSE'?f.rate:0,total,cash:s.cash,online:s.online});
  }
  if(f.k==='exp'){
    const amt=R(f.amount);
    if(!f.cat)return alert('Select expense type');
    if(!(amt>0))return alert('Enter amount');
    if(!f.pay)return alert('Select Online or Cash');
    const s=split(amt);
    put({type:f.cat==='Personal'?'rough':'expense',...stamp(),cat:f.cat,amount:amt,note:(f.note||'').trim(),cash:s.cash,online:s.online});
  }
  if(f.k==='stock'){
    if(f.qty===''||isNaN(+f.qty))return alert('Enter quantity');
    const L=f.item==='LOOSE',cur=L?looseNow():stockNow();
    const q=f.mode==='actual'?R(+f.qty-cur):R(f.qty);
    if(q===0)return alert('Nothing to change');
    put({type:'stock',...stamp(),item:f.item,qty:q,note:f.mode==='actual'?'Stock correction':(f.note||'').trim()},f.mode==='actual'?{title:`Correct ${L?'Loose':'BKT'} stock?`,html:`<div class="cfd"><div><span>Stock change</span><b>${sg(q)}${L?' L':''}</b></div></div>`,yes:'Yes, Correct'}:null);
  }
  if(f.k==='adj'){
    const cur=calc(tx);
    const c=f.mode==='actual'?R((+f.c||0)-cur.cash):R(f.c),o=f.mode==='actual'?R((+f.o||0)-cur.online):R(f.o);
    if(!c&&!o)return alert('Nothing to change');
    put({type:'adjust',...stamp(),cash:c,online:o},{title:'Adjust Cash / Online?',html:`<div class="cfd"><div><span>Cash change</span><b>${sg(c)}</b></div><div><span>Online change</span><b>${sg(o)}</b></div></div>`,yes:'Yes, Update'});
  }
}

let settling=false,fresh=false;
// Merge rough entries into ONE Personal expense per day (adds to the day's existing Personal entry if present)
async function settleDates(list,timeFor){
  const days={};list.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  const b=writeBatch(db);
  for(const d of Object.keys(days)){
    const r=days[d];
    const c=R(r.reduce((a,e)=>a+e.cash,0)),o=R(r.reduce((a,e)=>a+e.online,0));
    const note=[...r].sort((a,b)=>(a.ms||0)-(b.ms||0)).map(e=>`${e.note||'Item'} ${R(e.amount)}`).join(', ');
    r.forEach(e=>b.delete(doc(db,'tx',e.id)));
    const ex=tx.find(e=>e.type==='expense'&&e.cat==='Personal'&&e.date===d);
    if(ex)b.update(doc(db,'tx',ex.id),{amount:R(ex.amount+c+o),cash:R(ex.cash+c),online:R(ex.online+o),note:[ex.note,note].filter(Boolean).join(', ')});
    else b.set(doc(col),{type:'expense',cat:'Personal',date:d,time:timeFor(d),ms:Date.now(),amount:R(c+o),note,cash:c,online:o});
  }
  await b.commit();
}
// Auto: past days always, today after 23:30 (runs when the app is open)
async function autoSettle(){
  if(!user||settling||!fresh)return;
  const n=now();
  const due=tx.filter(e=>e.type==='rough'&&(e.date<n.d||(e.date===n.d&&n.t>='23:30')));
  if(!due.length)return;
  settling=true;
  try{await settleDates(due,()=>'23:30')}catch(e){console.error(e)}
  settling=false;
}
async function submitPersonal(){
  const n=now();
  const rough=tx.filter(e=>e.type==='rough'&&e.date<=n.d);
  if(!rough.length)return;
  const days={};rough.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  const rows=Object.keys(days).sort().map(d=>{
    const r=days[d],c=R(r.reduce((a,e)=>a+e.cash,0)),o=R(r.reduce((a,e)=>a+e.online,0));
    const ex=tx.find(e=>e.type==='expense'&&e.cat==='Personal'&&e.date===d);
    return `<div><span>${fd(d)}${ex?' (adds to existing entry)':''}</span><b>${fm(c+o)}</b></div>`;
  }).join('');
  const ok=await ask({title:'Submit personal expenses?',html:`<div class="cfd">${rows}</div><p class="cfp">One Personal entry per day will be made.</p>`,yes:'Yes, Submit'});
  if(!ok)return;
  settleDates(rough,d=>d===n.d?n.t:'23:30').catch(e=>alert('Failed: '+e.message));
}

  const d=b.dataset;
  if(d.set&&f){const v=d.v;f[d.set]=(v!==''&&!isNaN(v))?+v:v;if(f.k==='sale'&&(d.set==='rate'||d.set==='kind'))syncAmt();draw();return}
  if(d.cf!==undefined){cfDone(d.cf==='1');return}
  switch(d.act){
    case'login':{
      loginErr='';
      try{await signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value)}
      catch(e){loginErr='Wrong email or password';render()}
      break}
    case'logout':signOut(auth);break;
    case'mode':mode=d.v;render();break;
    case'tab':tab=d.v;render();break;
    case'hall':hdate='all';render();break;
    case'tnav':navDay(+d.v);break;
    case'htab':htab=d.v;render();break;
    case'hf':hf[htab]=d.v;render();break;
    case'sale':openSale();break;
    case'exp':openExp();break;
    case'stock':openPick();break;
    case'pickitem':openStock(null,'add',d.v);break;
    case'stockfix':openStock(null,'actual',d.v);break;
    case'adj':openAdj();break;
    case'close':closeSheet();break;
    case'save':if(f&&f.k==='cfg')saveCfg();else save();break;
    case'cfg':openCfg();break;
    case'submitp':submitPersonal();break;
    case'edit':{const e=tx.find(x=>x.id===d.id);if(!e)break;
      if(e.type==='sale')openSale(e);else if(e.type==='expense'||e.type==='rough')openExp(e);else if(e.type==='stock')openStock(e);else openAdj(e);break}
    case'del':{const e=tx.find(x=>x.id===d.id);if(!e)break;
      const ok=await ask({title:`Remove this ${lbl(e)}?`,html:show(e)+effect(tx.filter(x=>x.id!==e.id)),yes:'Yes, Remove',danger:true});
      if(ok)deleteDoc(doc(db,'tx',d.id)).catch(e=>alert('Failed: '+e.message));break}
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='hd'){hdate=t.value||null;render();return}
  if(t.dataset.in&&f){
    if(t.type==='date'){const sp=document.getElementById('dt_'+t.dataset.in);if(sp)sp.textContent=t.value?fd(t.value):'Select date'}
    f[t.dataset.in]=t.value;
    if(f.k==='sale'&&t.dataset.in==='litres'){syncAmt();const ai=$('#amtin');if(ai)ai.value=f.amt}
    if(f.k==='sale'&&$('#auto'))$('#auto').textContent='Calculated: '+fm(autoTotal());
    if(f.k==='sale'&&$('#tot'))$('#tot').textContent=fm(saleTotal());
  }
});
const inInput=e=>e.target&&e.target.closest&&e.target.closest('input');
document.addEventListener('contextmenu',e=>{if(!inInput(e))e.preventDefault()});
document.addEventListener('selectstart',e=>{if(!inInput(e))e.preventDefault()});
document.addEventListener('copy',e=>{if(!inInput(e))e.preventDefault()});
document.addEventListener('dragstart',e=>e.preventDefault());
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
$('#cf').addEventListener('click',e=>{if(e.target.id==='cf')cfDone(false)});

/* ---------- swipe on the day card ---------- */
let tsx=0,tsy=0,tmode=null,swiped=false;
const tinEl=()=>document.querySelector('.today .tin');
const tinReset=()=>{const t=tinEl();if(t){t.style.transition='transform .2s ease,opacity .2s ease';t.style.transform='';t.style.opacity=''}};
document.addEventListener('touchstart',e=>{
  const c=e.target.closest&&e.target.closest('.today');
  if(!c||e.touches.length!==1){tmode=null;return}
  tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;tmode='pending';
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!tmode)return;
  const dx=e.touches[0].clientX-tsx,dy=e.touches[0].clientY-tsy;
  if(tmode==='pending'){
    if(Math.abs(dx)<8&&Math.abs(dy)<8)return;
    tmode=Math.abs(dx)>Math.abs(dy)?'h':'v';
  }
  if(tmode!=='h')return;
  const t=tinEl();
  if(t){t.style.transition='none';t.style.transform=`translateX(${dx*0.6}px)`;t.style.opacity=String(Math.max(.3,1-Math.abs(dx)/260))}
},{passive:true});
document.addEventListener('touchend',e=>{
  if(tmode!=='h'){tmode=null;return}
  tmode=null;
  const dx=e.changedTouches[0].clientX-tsx,v=dx<0?1:-1;
  swiped=true;setTimeout(()=>{swiped=false},400);
  const t=tinEl();
  if(t&&Math.abs(dx)>50&&canNav(v)){
    t.style.transition='transform .14s ease,opacity .14s ease';
    t.style.transform=`translateX(${dx<0?-70:70}px)`;t.style.opacity='0';
    setTimeout(()=>navDay(v),140);
  }else tinReset();
},{passive:true});
document.addEventListener('touchcancel',()=>{if(tmode==='h')tinReset();tmode=null},{passive:true});

/* ---------- auth + data ---------- */
onAuthStateChanged(auth,u=>{
  user=u;
  if(unsub){unsub();unsub=null}
  if(u){
    unsub=onSnapshot(col,s=>{tx=s.docs.map(d=>({...d.data(),id:d.id}));if(!s.metadata.fromCache)fresh=true;render();autoSettle()},e=>alert('Data error: '+e.message));
  }else{tx=[];fresh=false}
  render();
});
render();
setInterval(autoSettle,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoSettle()});
</script>
</body>
</html>
